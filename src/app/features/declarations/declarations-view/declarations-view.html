<div class="declarations-container">
    <div class="declarations-header">
        <div>
            <h1>Deklaracje</h1>
        </div>

        <form [formGroup]="declarationsForm">
            <div class="declarations-actions">
                <label for="">Rok</label>
                <p-select [options]="years" formControlName="year" (onChange)="changeYear($event.value)" optionLabel="label" optionValue="value"></p-select>
                <button pButton label="Zapisz wszystko" icon="pi pi-save" severity="info"></button>
            </div>
        </form>
    </div>
    <div class="declarations-content">
        <p-tabs [value]="activeDeclarationType" (valueChange)="changeDeclarationType($event)">
            <p-tablist>
                <p-tab value="DRA">DRA</p-tab>
                <p-tab value="JPK">JPK</p-tab>
                <p-tab value="VAT_UE">VAT UE</p-tab>
            </p-tablist>
        </p-tabs>

        <app-declarations-table [declarationType]="activeDeclarationType" [year]="declarationsForm.controls.year.value"></app-declarations-table>
    </div>
</div>
