<form [formGroup]="editForm">
    <div class="dialog-content">
        <div class="form-row">
            <label for="cooperationStatus">Status współpracy:</label>
            <p-select formControlName="cooperationStatus" [options]="cooperationStatuList()" optionLabel="label" optionValue="value" inputId="cooperationStatus" placeholder="Wybierz status współpracy"></p-select>
        </div>
        @if(editForm.controls.cooperationStatus.value == 'cooperation_ended') {
            <div class="form-row">
                <label for="cooperationEnded">Data zakończenia współpracy:</label>
                <p-datepicker formControlName="cooperationEndedDate" inputId="cooperationEnded" dateFormat="yy-mm-dd" placeholder="Wybierz format" [showIcon]="true"></p-datepicker>
            </div>
        }
        <div class="form-row">
            <label for="accountManager">Opiekun:</label>
            <p-select formControlName="accountManager" [options]="usersList()" optionLabel="username" optionValue="id" inputId="accountManager" placeholder="Wybierz opiekuna klienta"></p-select>
        </div>
        <div class="form-row">
            <label for="">Nr. telefonu:</label>
            <input formControlName="phone" pInputText placeholder="Wpisz numer telefonu" type="text">
        </div>
        <div class="form-row">
            <label for="">E-mail:</label>
            <input formControlName="email" pInputText placeholder="Wpisz adres e-mail" type="text">
        </div>
        <div class="form-row">
            <label for="isVatPayer">Płatnik VAT:</label>
            <p-toggleswitch formControlName="isVatPayer" inputId="isVatPayer"></p-toggleswitch>
        </div>
        <div class="form-row-full">
            <label for="notes">Notatki:</label>
            <textarea pTextarea formControlName="notes" rows="5" placeholder="Dodaj notatki dotyczące klienta" id="notes"></textarea>
        </div>
    </div>
</form>
<div class="dialog-footer">
    <button pButton label="Anuluj" icon="pi pi-times" (click)="close()" severity="danger"></button>
    <button pButton label="Zapisz" icon="pi pi-save" [loading]="saving()" [disabled]="saving()" (click)="save()" severity="info"></button>
</div>
